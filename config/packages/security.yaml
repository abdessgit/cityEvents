security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }
        users_in_database:
            entity:
                class: App\Entity\Utilisateur
                property: email_utilisateur
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/v1/users/login
            stateless: true
            provider: users_in_database
            json_login:
                check_path: /api/v1/users/login
                username_path: email_utilisateur
                password_path: mdp_utilisateur
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api/v1/users
            stateless: true
            provider: users_in_database
            jwt: ~

        main:
            lazy: true
            provider: users_in_memory

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        #- { path: ^/users/login, roles: PUBLIC_ACCESS }
        # - { path: ^/users, roles: IS_AUTHENTICATED_FULLY }
        #------------------------------------------------------------------------------
        # toute les route concernat l'utilisateur 
       
        - { path: ^/api/v1/users/connecter, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/users/inscrire_moderator, roles:['ROLE_ADMIN'] }
        - { path: ^/api/v1/users/get_Mode, roles:['ROLE_ADMIN'] }
        - { path: ^/api/v1/users/get_user, roles:['ROLE_ADMIN', 'ROLE_MODERATEUR'] }
        - { path: ^/api/v1/users/\d+/bloque, roles:['ROLE_ADMIN', 'ROLE_MODERATEUR'] }
        - { path: ^/api/v1/users/\d+/debloquer, roles: ['ROLE_ADMIN', 'ROLE_MODERATEUR'] }
        #--------------------------------------------------------------------------------
        # toutes les route concernat evenements 
        - { path: ^/api/v1/events_add/d+/event, roles: ROLE_USER }
        #- { path: ^/api/v1/events_by_user/d+, roles: ROLE_USER , roles: ROLE_ADMIN , roles: ROLE_MODERATEUR }
        - {path: ^/api/v1/events/d+,  roles:['ROLE_USER' , 'ROLE_ADMIN' , 'ROLE_MODERATEUR'] }
        - { path: ^/api/v1/events/pending, roles: [ROLE_ADMIN , ROLE_MODERATEUR ,'ROLE_USER' ] }
        - { path: ^/api/v1/events/d+/validate, roles:['ROLE_ADMIN', 'ROLE_MODERATEUR'] }  
        - { path: ^/api/v1/events/d+/refuse, roles:['ROLE_ADMIN', 'ROLE_MODERATEUR'] } 
        - { path: ^/api/v1/events/d+/sponsored, roles:['ROLE_ADMIN', 'ROLE_MODERATEUR'] } 
        - { path: ^/api/v1/events/d+/noSponsored, roles:['ROLE_ADMIN', 'ROLE_MODERATEUR'] } 
        
when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
